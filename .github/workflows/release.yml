name: release

# タグ（例: v0.7.0）を push すると、Windows 用（tote.exe の zip）と Linux 用（.deb / .rpm / .AppImage）を
# ビルドして GitHub Releases に「下書き」で置く。内容を確認してから Publish する。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release -p tote

      - name: Package
        shell: pwsh
        run: |
          $name = "Tote-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory -Force -Path $name | Out-Null
          Copy-Item target/release/tote.exe, README.md, NOTICE.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Tote-*-windows-x64.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/tests-ui/package-lock.json

      - name: Test UI
        working-directory: app/tests-ui
        run: |
          npm ci
          npm run test:dom
          node --test tree.test.js

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      # app/tauri.linux.conf.json が Linux のときだけ自動で重なって、パッケージ作成が有効になる
      - name: Build packages
        working-directory: app
        run: cargo tauri build --bundles deb,rpm,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  release:
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: 'Tote ${{ github.ref_name }}'
          body: 'Windows: zip を展開して tote.exe を実行（設定画面から右クリック登録）。Linux: .deb / .rpm / .AppImage。使い方は README を参照。'
          files: dist/*
