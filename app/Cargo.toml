[package]
name = "tote"
version = "0.7.1"
edition = "2024"
license = "MIT"
rust-version = "1.94"

[features]
# ビューア(Tauri)。Linux上でロジックだけテストするときは --no-default-features
default = ["viewer"]
viewer = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:drag", "dep:tauri-build"]

[dependencies]
tote-core = { version = "0.7.1", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.1", features = ["custom-protocol"], optional = true }
tauri-plugin-dialog = { version = "2.8.1", optional = true }
drag = { version = "2.1.1", optional = true }

[target."cfg(windows)".dependencies]
mslnk = "0.1.8"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
tauri-build = { version = "2.7.1", optional = true , features = [] }
