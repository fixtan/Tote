[package]
name = "tote"
version = "0.1.0"
edition = "2024"

[dependencies]
tote-core = { version = "0.1.0", path = "../core" }

[target."cfg(windows)".dependencies]
mslnk = "0.1.8"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }
