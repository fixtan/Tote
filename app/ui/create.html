<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>書庫を作成 - Tote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="settings">
  <header class="toolbar">
    <strong>書庫を作成</strong>
    <div class="spacer"></div>
    <span id="src" class="dim"></span>
  </header>

  <main class="page" id="form">
    <section>
      <div class="field"><label for="fmt">形式</label><select id="fmt"></select></div>
      <div class="field" id="rowLevel"><label for="level">圧縮レベル</label><select id="level"></select></div>
      <label class="radio" id="rowSolid"><input type="checkbox" id="solid"> <span>固体圧縮（全体をまとめて圧縮して小さくする。一部だけ取り出すときは少し遅くなる）</span></label>
    </section>

    <section id="pwSec">
      <h2>パスワード（空ならなし）</h2>
      <div class="field"><label for="pw">パスワード</label><input type="password" id="pw" autocomplete="off" spellcheck="false"></div>
      <div class="field"><label for="pw2">もう一度</label><input type="password" id="pw2" autocomplete="off" spellcheck="false"></div>
      <label class="radio"><input type="checkbox" id="showPw"> <span>パスワードを表示する</span></label>
      <label class="radio" id="rowNames"><input type="checkbox" id="encNames"> <span>ファイル名も暗号化する（開くときもパスワードが必要になる）</span></label>
      <p class="note" id="pwNote"></p>
    </section>

    <section>
      <h2>保存先</h2>
      <div class="field"><span class="pathbox"><span id="dir" class="path"></span></span><button id="btnDir">変更…</button></div>
      <div class="field"><label for="stem">名前</label><span class="namebox"><input id="stem" spellcheck="false"><span id="ext" class="dim"></span></span></div>
    </section>

    <div id="err" class="msg error" hidden></div>
    <div class="btnrow end">
      <button id="btnCancel">キャンセル</button>
      <button id="btnCreate" class="primary">作成</button>
    </div>
  </main>

  <main class="page" id="result" hidden>
    <section>
      <h2 id="resTitle">作成しました</h2>
      <p class="note" id="resText"></p>
      <div class="btnrow">
        <button id="btnReveal" class="primary">フォルダで表示</button>
        <button id="btnClose">閉じる</button>
      </div>
    </section>
  </main>

  <div id="toast" role="status" hidden>
    <span id="toastMsg"></span>
    <button id="toastAct" hidden></button>
  </div>

  <dialog id="dlg">
    <form method="dialog">
      <p id="dlgMsg"></p>
      <div class="dlg-row">
        <button value="cancel">キャンセル</button>
        <button value="ok" id="dlgOk" class="primary">OK</button>
      </div>
    </form>
  </dialog>

  <script src="create.js"></script>
</body>
</html>
